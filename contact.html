<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Ansamblul Celesta</title>
  <link rel="stylesheet" href="style.css?v=2.0">
  <!-- EmailJS SDK -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>
  <header>
    <div class="logo">Celesta</div>
    <nav>
      <a href="index.html">Acasă</a>
      <a href="playlist.html">Playlist</a>
      <a href="evenimente.html">Evenimente</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </header>

  <main>
    <section class="contact-section">
      <h1>Contactează-ne</h1>
      <p>Ai o întrebare sau dorești să ne inviți la un eveniment? Trimite-ne un mesaj!</p>

      <form id="contact-form">
        <div class="form-group">
          <label for="nume">Nume complet:</label>
          <input type="text" id="nume" name="nume" required>
        </div>

        <div class="form-group">
          <label for="email">Adresă de Email:</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="mesaj">Mesajul tău:</label>
          <textarea id="mesaj" name="mesaj" rows="5" required></textarea>
        </div>

        <button type="submit" class="btn">Trimite Mesajul</button>
        <div id="form-status" class="form-status"></div>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; Ansamblul Celesta. Toate drepturile rezervate.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
