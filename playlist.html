<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playlist</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="stars"></div>

  <header>
    <h1>Ansamblul vocal-instrumental "Celesta"</h1>

    <nav>
      <a href="index.html">Acasă</a>
      <a href="despre.html">Despre noi</a>
      <a href="evenimente.html">Evenimente</a>
      <a href="playlist.html" class="active">Playlist</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <section class="section">
    <h3>Playlist</h3>

    <div class="playlist-page">
      <div class="playlist-hero page-animate">
        <div class="playlist-hero-copy">
          <div class="playlist-hero-actions">
            <button
              class="playlist-tab playlist-hero-tab active"
              data-playlist="rock"
            >
              Rock
            </button>

            <button
              class="playlist-tab playlist-hero-tab"
              data-playlist="pop"
            >
              Pop
            </button>
          </div>
        </div>
      </div>

      <div class="playlist-stage page-animate-delay-1">
        <section class="music-panel playlist-browser">
          <div class="panel-heading">
            <h4>Lista melodii</h4>
            <p id="playlist-selected-type">Ai ales melodii rock.</p>
          </div>

          <ol class="playlist-list" id="playlist-list"></ol>
        </section>

        <section class="music-panel player-panel">
          <div class="panel-heading">
            <h4>Player</h4>
          </div>

          <div class="player-shell">
            <div class="player-disc">
              <span>♪</span>
            </div>

            <div class="player-meta">
              <audio id="audio-player"></audio>

              <div class="player-now-playing">
                <strong id="player-song-title">—</strong>
                <span id="player-song-artist">—</span>
              </div>

              <div class="player-controls">
                <button onclick="prevSong()">⏮</button>
                <button onclick="togglePlay()" id="play-btn">▶</button>
                <button onclick="nextSong()">⏭</button>
              </div>

              <div class="player-timing">
                <span id="current-time">00:00</span>
                <span id="duration-time">00:00</span>
              </div>

              <input
                type="range"
                id="progress"
                value="0"
                min="0"
                max="100"
                step="0.1"
              >
            </div>
          </div>
        </section>
      </div>
    </div>
  </section>

  <footer>&copy; 2025 Celesta</footer>

  <script src="script.js"></script>
</body>
</html>
