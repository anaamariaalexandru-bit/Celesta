<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playlist - Ansamblul Celesta</title>
  <link rel="stylesheet" href="style.css?v=2.0">
</head>
<body>
  <header>
    <div class="logo">Celesta</div>
    <nav>
      <a href="index.html">Acasă</a>
      <a href="playlist.html" class="active">Playlist</a>
      <a href="evenimente.html">Evenimente</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="playlist-page">
    <section class="playlist-header">
      <h1>Muzica Noastră</h1>
      <div class="playlist-tabs-container">
        <button class="playlist-tab active" data-playlist="rock">Rock</button>
        <button class="playlist-tab" data-playlist="pop">Pop</button>
      </div>
      <p id="playlist-selected-type"></p>
    </section>

    <section class="playlist-content">
      <ul id="playlist-list" class="playlist-list"></ul>
    </section>

    <!-- Fixed Audio Player Bottom Bar -->
    <div class="audio-player-bar">
      <div class="player-disc"></div>
      <div class="player-info">
        <div id="player-song-title">Selectează o melodie</div>
        <div id="player-song-artist">Celesta</div>
      </div>
      <div class="player-controls">
        <button onclick="prevSong()" class="control-btn">⏮</button>
        <button id="play-btn" onclick="togglePlay()" class="control-btn play-btn">▶</button>
        <button onclick="nextSong()" class="control-btn">⏭</button>
      </div>
      <div class="player-progress">
        <span id="current-time">00:00</span>
        <input type="range" id="progress" value="0" min="0" max="100">
        <span id="duration-time">00:00</span>
      </div>
      <audio id="audio-player"></audio>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
