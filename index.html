<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ansamblul Celesta - Acasă</title>
  <link rel="stylesheet" href="style.css?v=2.0">
</head>
<body>
  <header>
    <div class="logo">Celesta</div>
    <nav>
      <a href="index.html" class="active">Acasă</a>
      <a href="playlist.html">Playlist</a>
      <a href="evenimente.html">Evenimente</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>Ansamblul Celesta</h1>
      <p>Muzică, pasiune și momente de neuitat.</p>
    </section>

    <!-- Galeria de imagini legată la Lightbox-ul din script.js -->
    <section class="gallery-section">
      <h2>Galerie Foto</h2>
      <div class="gallery-container">
        <img src="imagini/foto1.jpg" alt="Imagine Celesta 1">
        <img src="imagini/foto2.jpg" alt="Imagine Celesta 2">
        <img src="imagini/foto3.jpg" alt="Imagine Celesta 3">
      </div>
    </section>

    <!-- Modal Lightbox -->
    <div id="lightbox" class="lightbox" aria-hidden="true">
      <button class="lightbox-close">&times;</button>
      <button class="lightbox-prev">&#10094;</button>
      <div class="lightbox-content">
        <img id="lightbox-image" src="" alt="">
        <div id="lightbox-counter"></div>
      </div>
      <button class="lightbox-next">&#10095;</button>
    </div>
  </main>

  <footer>
    <p>&copy; Ansamblul Celesta. Toate drepturile rezervate.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
